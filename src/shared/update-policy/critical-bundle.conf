# smplOS critical bundle metadata
#
# This file is read by smplos-update after regular updates complete.
# If BUNDLE_ID differs from the locally applied id, the user is prompted
# to install this package set as an explicit critical-stack update.
#
# PACKAGES accepts plain package names and/or pinned specs like:
#   nvidia=570.153.02-1
#
# NOTE: pinned versions are only reliable if your repos/cache keep them.

BUNDLE_ID="2026.08.04-3"
DESCRIPTION="Baseline refresh: linux-lts + kernel-modules-hook (+ the NVIDIA open driver where installed)"
REBOOT_REQUIRED=1

# Hyprland series smplOS has validated. smplos-update upgrades the whole system,
# the Hyprland stack included, in one transaction while Arch ships this series
# (patch releases arrive normally); a newer series is held back until this is
# raised after testing it. See critical-packages.txt.
HYPRLAND_SERIES="0.56"

# The bundle only re-asserts smplOS baseline packages on hosts upgraded from
# older ISOs that predate them; their versions roll forward with the normal
# system upgrade. It is applied once per BUNDLE_ID, and only after this run's
# system upgrade completed, so it never installs onto a partially updated
# system.
#
# kernel-modules-hook preserves the running kernel's module tree past
# linux-lts upgrades so overlay/nvidia/dkms modules keep loading until reboot.
PACKAGES="linux-lts linux-lts-headers kernel-modules-hook"

# Refreshed only where installed under exactly that name, so the NVIDIA open
# driver is never forced onto AMD/Intel hosts or legacy nvidia-580xx hosts
# (installer: src/shared/installer/config/hardware/nvidia.sh).
PACKAGES_IF_INSTALLED="nvidia-open-dkms nvidia-utils lib32-nvidia-utils"
