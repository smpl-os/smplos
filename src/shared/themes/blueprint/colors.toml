# Monochrome drafting glass, white frame lines and safety-orange highlights.
background = "#000000"
bg_light = "#080808"
bg_lighter = "#181818"
surface = "#101010"

foreground = "#ffffff"
fg_dim = "#d6d6d6"
fg_alt = "#ffffff"
muted = "#999999"
autosuggestion = "#999999"

accent = "#ff8a30"
accent_alt = "#ffffff"
cursor = "#ffffff"
selection_foreground = "#000000"
selection_background = "#ff8a30"

danger = "#ff8a30"
success = "#ffffff"
warning = "#ff8a30"
info = "#d6d6d6"
danger_bright = "#ffac6b"
success_bright = "#ffffff"
warning_bright = "#ffac6b"
accent_bright = "#ffac6b"
accent_alt_bright = "#ffffff"
info_bright = "#ffffff"

# Keep terminal diagnostics vivid without adding color to the desktop palette.
term_0 = "#000000"
term_1 = "#ff6666"
term_2 = "#8ee36b"
term_3 = "#ffd166"
term_4 = "#62b5ff"
term_5 = "#d49bff"
term_6 = "#4de1ed"
term_7 = "#eeeeee"
term_8 = "#a0a0a0"
term_9 = "#ff9696"
term_10 = "#b5f58c"
term_11 = "#ffe49a"
term_12 = "#a1d6ff"
term_13 = "#e7c2ff"
term_14 = "#9af4ff"
term_15 = "#ffffff"

rounding = "2"
app_rounding = "2"
rounding_power = "2.0"
blur_size = "4"
blur_passes = "2"
opacity_active = "0.80"
opacity_inactive = "0.80"
term_opacity_active = "0.80"
term_opacity_inactive = "0.80"
popup_opacity = "0.80"
app_background_opacity = "0.80"
messenger_opacity = "0.80"
browser_opacity = "0.80"

gaps_in = "8"
gaps_out = "12"
border_size = "2"
border_active = "rgb(e6e6e6)"
border_inactive = "rgb(555555)"

# The plugin owns the static focused halo; no extra compositor glow.
shadow_range = "0"
shadow_color = "rgba(00000000)"
shadow_color_inactive = "rgba(00000000)"
glow = "false"
glow_color = "rgba(e6e6e6ff)"
glow_color_inactive = "rgba(00000000)"
border_animation = "false"
hud_frame = "true"
hud_style = "minimal"
hud_gap = "1"
hud_chamfer = "0"
hud_line_width = "2"
hud_sweep = "false"
hud_glow_focused_only = "true"
hud_glow_range = "18"
hud_glow_alpha = "0.90"

app_theme_nvim = "blueprint"
app_theme_vscode = "blueprint"
