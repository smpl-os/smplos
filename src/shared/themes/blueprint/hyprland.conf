# smplOS Hyprland Theme — auto-generated from colors.toml
$activeBorderColor = rgb(e6e6e6)
$inactiveBorderColor = rgb(555555)

# Decoration overrides (theme-controlled)
$themeRounding = 2
$themeRoundingPower = 2.0
$themeGapsIn = 8
$themeGapsOut = 12
$themeBorderSize = 2
$themeBlurSize = 4
$themeBlurPasses = 2
$themeOpacityActive = 0.80
$themeOpacityInactive = 0.80
$themePopupOpacity = 0.80
$themeMessengerOpacity = 0.80
$themeBrowserOpacity = 0.80

# Window effects (optional; defaults = classic subtle shadow, no glow, static border)
$themeShadowRange = 0
$themeShadowRenderPower = 3
$themeShadowColor = rgba(00000000)
$themeShadowColorInactive = rgba(00000000)
$themeGlow = 0
$themeGlowRange = 10
$themeGlowRenderPower = 3
$themeGlowColor = rgba(e6e6e6ff)
$themeGlowColorInactive = rgba(00000000)
$themeBorderAnimation = 0

# HUD frames (read by the smpl-hud Hyprland plugin; Hyprland ignores these)
$themeHudFrame = 1
$themeHudStyle = minimal
$themeHudGap = 1
$themeHudChamfer = 0
$themeHudLineWidth = 2
$themeHudFloatGlowRange = 0
$themeHudGlowRange = 18
$themeHudGlowAlpha = 0.90
$themeHudSweep = 0
$themeHudSweepSpeed = 80
$themeHudSweepLength = 180
$themeHudGlowFocusedOnly = 1
$themeHudHideBorder = 0
$themeHudGlyphColor = none
$themeHudSideOpacity = 1
$themeHudEdgeOpacity = 1
$themeHudUnderglow = 0
$themeHudScanner = 0
$themeHudScannerBlur = 1
