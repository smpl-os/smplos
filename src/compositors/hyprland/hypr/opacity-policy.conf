# Must load after apps/*: safety exemptions win over browser/messenger rules.
# match:fullscreen is boolean, not fullscreen_state's numeric enum.
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:tag self-managed-alpha
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:tag compositor-opaque
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:tag pip
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:class ^steam_app_[0-9]+$
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:content ^(photo|video|game)$
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:fullscreen 1
