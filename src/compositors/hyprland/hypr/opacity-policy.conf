# Must load after apps/*: safety exemptions win over browser/messenger rules.
# match:fullscreen is boolean, not fullscreen_state's numeric enum.
# Keep match:class .* so title/class updates replay these exemptions too.
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:class .*, match:tag self-managed-alpha
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:class .*, match:tag compositor-opaque
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:class .*, match:tag pip
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:class ^steam_app_[0-9]+$
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:class .*, match:content ^(photo|video|game)$
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:class .*, match:fullscreen 1
