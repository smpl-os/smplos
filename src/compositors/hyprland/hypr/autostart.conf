# smplOS Hyprland Autostart Configuration

# Keep this session's compositor log after a hang or reboot
# (journalctl -b -1 -t hyprland).
exec-once = smplos-hypr-log-journal

# Core services
# NOTE: hypridle is now managed by the packaged systemd user unit
#       (hypridle.service, enabled via /etc/skel + migration). Launching it
#       here as well would create two competing daemons — both respond to
#       logind Lock/Sleep signals and fight over the after_sleep_cmd chain.
# exec-once = hypridle
exec-once = dunst

# Sync saved keyboard layouts to compositor (before EWW bar starts)
exec-once = kb-sync

# Generate messenger toggle keybindings (auto-detects installed apps)
exec-once = generate-messenger-bindings

# Restore last wallpaper (must run before bar to generate colors)
exec-once = bash -c 'theme-bg-init'

# Status bar - EWW by default; backend=smpl-bar is an explicit side-by-side gate.
# The session falls back to EWW if the native release is not installed.
exec-once = bash -c 'sleep 0.5 && bar-session-start'
# Keep a hidden Start Menu running so Super shows it instantly (no-op for
# start-menu builds without resident support).
exec-once = bash -c 'sleep 2 && toggle-start-menu --preload'

# Window guard — snap floating windows that end up off-screen back into view
exec-once = window-guard

# HUD borders: load the compositor plugin (draws nothing unless the active
# theme sets hud_frame = true; a silent no-op if no build matches this Hyprland)
exec-once = smplos-plugins load

# Restore workspace-group monitor assignments (multi-monitor: each group owns all monitors)
exec-once = bash -c 'sleep 1 && workspace-session-init'

# Auto-mount USB, CD, HDD (notify on mount/unmount)
exec-once = automount

# Credential storage (VS Code, Brave, git, etc.)
# Pipe empty password to --unlock so the keyring auto-unlocks on autologin
# (PAM can't unlock it because greetd autologin never prompts for a password)
exec-once = echo "" | gnome-keyring-daemon --start --unlock --components=secrets,pkcs11,ssh

# Clean stale browser locks (VM force-shutdown leaves these behind)
exec-once = pgrep -x brave >/dev/null || rm -f ~/.config/BraveSoftware/Brave-Browser/Singleton*

# Propagate full environment to systemd/dbus (portals, gnome-keyring, etc.)
# xdg-desktop-portal-gtk needs the session env to read gsettings/dconf
# smplos-session-services imports it and starts the graphical session's user
# services (hypridle power timers, dictation, XR watcher); a plain
# start-hyprland session never activates graphical-session.target on its own.
exec-once = smplos-session-services
exec-once = dbus-update-activation-environment --systemd --all

# Welcome notification with essential keybindings (first boot only)
exec-once = smplos-first-run

# Remind user to reboot if a critical update is pending (self-clears after reboot)
exec-once = bash -c 'sleep 3 && smplos-reboot-notify'

# Setup AppImage desktop entries (offline, first boot)
exec-once = smplos-appimage-setup

# Install Flatpak apps from bundled list (needs internet, first boot)
exec-once = smplos-flatpak-setup
