# Browser types
windowrule = tag +chromium-based-browser, match:class ((google-)?[cC]hrom(e|ium)|[bB]rave-browser|[mM]icrosoft-edge|Vivaldi-stable|helium)
windowrule = tag +firefox-based-browser, match:class ([fF]irefox|zen|librewolf)

# Stock browser alpha follows the theme; authors can set browser_opacity.
# class .* keeps the override in title/class-triggered incremental rule replay.
windowrule = opacity $themeBrowserOpacity override $themeBrowserOpacity override, match:class .*, match:tag chromium-based-browser
windowrule = opacity $themeBrowserOpacity override $themeBrowserOpacity override, match:class .*, match:tag firefox-based-browser

# Force chromium-based browsers into a tile to deal with --app bug
windowrule = tile on, match:tag chromium-based-browser
