name: Critical stack policy

on:
  pull_request:
    paths:
      - ".github/workflows/update-policy.yml"
      - "src/shared/update-policy/**"
      - "src/shared/bin/smplos-update"
      - "src/shared/bin/smplos-pacman"
      - "src/shared/bin/smplos-update-*"
      - "src/shared/bin/smplos-reboot-notify"
      - "src/shared/lib/smplos-reboot.sh"
      - "src/shared/bin/smplos-os-update"
      - "src/shared/bin/smplos-migrate"
      - "src/shared/configs/smplos/bindings.conf"
      - "src/compositors/hyprland/hypr/bindings_loader.lua"
      - "tests/test_scrolling_bindings.py"
      - "tests/test_keybind_help.py"
      - "tests/test_keybinding_migrations.py"
      - "src/shared/bin/generate-messenger-bindings"
      - "src/shared/lib/smplos-update-entry.sh"
      - "src/shared/lib/smplos-session-env.sh"
      - "src/fetch-apps.sh"
      - "src/fetch-org.sh"
      - "src/shared/bin/smplos-ensure-yay"
      - "src/shared/bin/heal-paru"
      - "src/shared/bin/rebuild-paru"
      - "src/shared/lib/smplos-pkgbuild.sh"
      - "src/shared/lib/smplos-control-surface.sh"
      - "src/shared/lib/smplos-release-package.sh"
      - "src/shared/pkgbuilds/control-surface/**"
      - "src/build-iso.sh"
      - "tests/test_keypad.py"
      - "tests/test_mouse.py"
      - "src/shared/pkgbuilds/yay-bin/**"
      - "src/shared/pkgbuilds/eww-smplos/**"
      - "src/shared/packages-aur.txt"
      - "src/shared/packages-flatpak.txt"
      - "src/shared/packages-appimage.txt"
      - "src/editions/productivity/**"
      - "src/builder/build.sh"
      - "src/shared/bin/theme-set"
      - "src/shared/bin/theme-set-st"
      - "src/shared/installer/install.sh"
      - "src/shared/bin/bar-ctl"
      - "tests/test_eww_delivery.py"
      - "src/shared/lib/smplos-app-bundle.sh"
      - "src/shared/installer/automated_script.sh"
      - "migrations/**"
      - "tests/test_update_safety.py"
      - "tests/test_reboot_update.py"
      - "tests/test_update_handoff.py"
      - "tests/test_yay_delivery.py"
      - "tests/test_app_delivery.py"
      - "tests/test_bar_ctl.py"
      - "tests/test_dropped_packages.py"
      - "tests/test_logseq_retirement.py"
      - "tests/test_theme_switching.py"
      - "tests/test_critical_bundle.py"
      - "tests/test_update_pins.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-policy.yml"
      - "src/shared/update-policy/**"
      - "src/shared/bin/smplos-update"
      - "src/shared/bin/smplos-pacman"
      - "src/shared/bin/smplos-update-*"
      - "src/shared/bin/smplos-reboot-notify"
      - "src/shared/lib/smplos-reboot.sh"
      - "src/shared/bin/smplos-os-update"
      - "src/shared/bin/smplos-migrate"
      - "src/shared/configs/smplos/bindings.conf"
      - "src/compositors/hyprland/hypr/bindings_loader.lua"
      - "tests/test_scrolling_bindings.py"
      - "tests/test_keybind_help.py"
      - "tests/test_keybinding_migrations.py"
      - "src/shared/bin/generate-messenger-bindings"
      - "src/shared/lib/smplos-update-entry.sh"
      - "src/shared/lib/smplos-session-env.sh"
      - "src/fetch-apps.sh"
      - "src/fetch-org.sh"
      - "src/shared/bin/smplos-ensure-yay"
      - "src/shared/bin/heal-paru"
      - "src/shared/bin/rebuild-paru"
      - "src/shared/lib/smplos-pkgbuild.sh"
      - "src/shared/lib/smplos-control-surface.sh"
      - "src/shared/lib/smplos-release-package.sh"
      - "src/shared/pkgbuilds/control-surface/**"
      - "src/build-iso.sh"
      - "tests/test_keypad.py"
      - "tests/test_mouse.py"
      - "src/shared/pkgbuilds/yay-bin/**"
      - "src/shared/pkgbuilds/eww-smplos/**"
      - "src/shared/packages-aur.txt"
      - "src/shared/packages-flatpak.txt"
      - "src/shared/packages-appimage.txt"
      - "src/editions/productivity/**"
      - "src/builder/build.sh"
      - "src/shared/bin/theme-set"
      - "src/shared/bin/theme-set-st"
      - "src/shared/installer/install.sh"
      - "src/shared/bin/bar-ctl"
      - "tests/test_eww_delivery.py"
      - "src/shared/lib/smplos-app-bundle.sh"
      - "src/shared/installer/automated_script.sh"
      - "migrations/**"
      - "tests/test_update_safety.py"
      - "tests/test_reboot_update.py"
      - "tests/test_update_handoff.py"
      - "tests/test_yay_delivery.py"
      - "tests/test_app_delivery.py"
      - "tests/test_bar_ctl.py"
      - "tests/test_dropped_packages.py"
      - "tests/test_logseq_retirement.py"
      - "tests/test_theme_switching.py"
      - "tests/test_critical_bundle.py"
      - "tests/test_update_pins.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check shell syntax
        run: |
          for script in src/shared/bin/smplos-update src/shared/bin/smplos-os-update src/shared/bin/smplos-pacman \
            src/shared/bin/smplos-migrate src/shared/bin/theme-set src/shared/bin/theme-set-st src/builder/build.sh \
            src/shared/bin/generate-messenger-bindings \
            src/shared/lib/smplos-update-entry.sh \
            src/shared/lib/smplos-session-env.sh src/fetch-apps.sh src/fetch-org.sh \
            src/shared/lib/smplos-reboot.sh src/shared/bin/smplos-reboot-notify \
            src/shared/bin/smplos-update-apps src/shared/bin/smplos-update-bootstrap src/shared/bin/bar-ctl \
            src/shared/bin/smplos-ensure-yay src/shared/bin/heal-paru src/shared/bin/rebuild-paru \
            src/shared/pkgbuilds/yay-bin/PKGBUILD src/shared/pkgbuilds/eww-smplos/PKGBUILD src/shared/lib/smplos-pkgbuild.sh \
            src/shared/lib/smplos-app-bundle.sh src/shared/installer/automated_script.sh \
            src/shared/lib/smplos-control-surface.sh src/shared/lib/smplos-release-package.sh \
            src/shared/pkgbuilds/control-surface/PKGBUILD src/build-iso.sh \
            src/shared/update-policy/critical-bundle.conf migrations/*.sh; do
            bash -n "$script" || exit 1
          done
      - name: Check protected-stack planning and one-transaction upgrades
        run: PYTHONPATH=tests python3 -m unittest test_critical_bundle test_update_pins -v
      - name: Install isolated notification test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y dunst xvfb xauth lua5.4
      - name: Check update safeguards, diagnostics and delivery
        run: |
          python3 -m unittest discover -s tests -p 'test_update_safety.py' -v
          python3 -m unittest discover -s tests -p 'test_reboot_update.py' -v
          python3 -m unittest discover -s tests -p 'test_update_handoff.py' -v
          python3 -m unittest discover -s tests -p 'test_yay_delivery.py' -v
          python3 -m unittest discover -s tests -p 'test_app_delivery.py' -v
          PYTHONPATH=tests python3 -m unittest test_keypad test_mouse -v
          python3 -m unittest discover -s tests -p 'test_bar_ctl.py' -v
          python3 -m unittest discover -s tests -p 'test_eww_delivery.py' -v
          python3 -m unittest discover -s tests -p 'test_dropped_packages.py' -v
          PYTHONPATH=tests python3 -m unittest test_logseq_retirement test_theme_switching -v
          PYTHONPATH=tests python3 -m unittest test_scrolling_bindings test_keybind_help test_keybinding_migrations -v
      - name: Check the real root-to-user handoff without running updates
        run: |
          sudo -n env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tests \
            "$(command -v python3)" -m unittest test_update_handoff.PrivilegedHandoffTests -v

  pinned-transaction:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - uses: actions/checkout@v5
      - name: Install test dependencies
        run: pacman -Syu --noconfirm --needed python fakeroot
      - name: Exercise real pacman dependency resolution against isolated fixture databases
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tests python3 -m unittest test_update_pins -v
