name: Theme alpha and generation

on:
  push:
    branches: [main]
    paths:
      - 'src/*theme*'
      - 'src/regen-nemo-css.py'
      - 'src/test-nemo-css.py'
      - 'src/test-gtk-defaults.py'
      - 'src/shared/themes/**'
      - 'src/shared/bin/theme-set*'
      - 'src/shared/lib/smplos-gtk.py'
      - 'migrations/*standard-gtk-defaults.sh'
      - 'src/shared/packages.txt'
      - 'src/compositors/*/postinstall.sh'
      - 'src/compositors/niri/config.kdl'
      - 'src/shared/bin/smplos-plugins'
      - 'src/shared/bin/smplos-os-update'
      - 'src/shared/bin/bar-ctl'
      - 'src/shared/eww/**'
      - 'src/shared/installer/automated_script.sh'
      - 'release/dev-local.sh'
      - 'release/dev-push.sh'
      - 'release/dev-apply.sh'
      - 'tests/test_keypad_glass.py'
      - 'tests/test_bar_ctl.py'
      - 'tests/test_dev_local.py'
      - 'tests/test_smplos_plugins.py'
      - 'src/builder/build.sh'
      - 'src/compositors/hyprland/hypr/**'
      - 'src/compositors/hyprland/plugins/**'
      - 'tests/test_theme*.py'
      - 'tests/test_openchamber_theme_sync.py'
      - '.github/workflows/themes.yml'
  pull_request:
    paths:
      - 'src/*theme*'
      - 'src/regen-nemo-css.py'
      - 'src/test-nemo-css.py'
      - 'src/test-gtk-defaults.py'
      - 'src/shared/themes/**'
      - 'src/shared/bin/theme-set*'
      - 'src/shared/lib/smplos-gtk.py'
      - 'migrations/*standard-gtk-defaults.sh'
      - 'src/shared/packages.txt'
      - 'src/compositors/*/postinstall.sh'
      - 'src/compositors/niri/config.kdl'
      - 'src/shared/bin/smplos-plugins'
      - 'src/shared/bin/smplos-os-update'
      - 'src/shared/bin/bar-ctl'
      - 'src/shared/eww/**'
      - 'src/shared/installer/automated_script.sh'
      - 'release/dev-local.sh'
      - 'release/dev-push.sh'
      - 'release/dev-apply.sh'
      - 'tests/test_keypad_glass.py'
      - 'tests/test_bar_ctl.py'
      - 'tests/test_dev_local.py'
      - 'tests/test_smplos_plugins.py'
      - 'src/builder/build.sh'
      - 'src/compositors/hyprland/hypr/**'
      - 'src/compositors/hyprland/plugins/**'
      - 'tests/test_theme*.py'
      - 'tests/test_openchamber_theme_sync.py'
      - '.github/workflows/themes.yml'

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check shell syntax
        run: |
          # bash -n reads only its first operand; check every script on its own.
          for script in \
            src/regen-all-themes.sh \
            src/generate-theme-configs.sh \
            src/shared/bin/theme-set \
            migrations/20261027-140000-standard-gtk-defaults.sh \
            src/compositors/hyprland/postinstall.sh \
            src/compositors/niri/postinstall.sh \
            src/shared/bin/bar-ctl \
            release/dev-local.sh \
            src/builder/build.sh \
            src/shared/bin/smplos-plugins \
            src/shared/bin/smplos-os-update \
            src/shared/installer/automated_script.sh \
            release/dev-push.sh \
            release/dev-apply.sh
          do
            bash -n "$script"
          done
      - name: Check generated themes without rewriting files
        run: bash src/regen-all-themes.sh --check
      - name: Exercise isolated theme fixtures
        run: python3 -m unittest discover -s tests -p 'test_theme*.py' -v
      - name: Exercise OpenChamber bridge and OS delivery without a running app
        run: python3 -m unittest discover -s tests -p 'test_openchamber_theme_sync.py' -v
      - name: Unit-test the Hyprland plugins without a compositor
        run: |
          make -C src/compositors/hyprland/plugins/smpl-hud test
          make -C src/compositors/hyprland/plugins/smpl-scroll test
      - name: Check glass opt-in, local deployment lifecycle and plugin delivery
        run: PYTHONPATH=tests python3 -m unittest test_keypad_glass test_bar_ctl test_dev_local test_smplos_plugins -v
      - name: Install GTK renderer test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 gir1.2-gtk-4.0 gir1.2-adw-1 dconf-gsettings-backend gsettings-desktop-schemas xdg-desktop-portal-gtk xvfb xauth
      - name: Render native controls and background ownership
        run: xvfb-run -a /usr/bin/python3 src/test-nemo-css.py
      - name: Verify standard GTK icons and live light/dark preferences
        run: xvfb-run -a /usr/bin/python3 src/test-gtk-defaults.py
