name: Keybindings

# Checks every keyboard shortcut on every push to main and every pull request. There is no path
# filter on purpose: it lets both jobs be required status checks (a required check that a path
# filter skipped waits forever) and catches a shortcut broken by a change somewhere unexpected,
# such as a script a bind runs or a package list.
#
#   static  bindings_loader.lua parity and the static rules, with only Lua. Fast and exact.
#   native  the same, plus `Hyprland --verify-config` on every bind, on the approved shared
#           update-policy/ci-baseline.json snapshot. Latest Arch is a separate warning workflow
#           (keybindings-forward.yml), never the approved-release gate.
#
# The lab, which presses every chord in a headless Hyprland, needs a GPU render node and runs
# locally: tools/keybind-check lab. DEVELOPMENT.md explains all of it. auto-release.yml calls this
# workflow (`uses: ./.github/workflows/keybindings.yml`) and its version bump needs it, so a
# failure here stops the release.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_call:
  workflow_dispatch:
    inputs:
      filter:
        description: "Only tests whose name contains this (unittest -k), e.g. SUPER_TAB or workspaces"
        required: false
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  static:
    name: static (rules and loader parity)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEYBIND_CHECK_REQUIRE: lua,xkbcommon
      PYTHONDONTWRITEBYTECODE: "1"
      FILTER: ${{ inputs.filter }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lua and libxkbcommon
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends lua5.4 libxkbcommon0
      - name: Show the tools under test
        run: python3 --version && tools/keybind-check doctor
      - name: Check every bind
        run: |
          args=()
          if [ -n "$FILTER" ]; then args=(-k "$FILTER"); fi
          PYTHONPATH=tests python3 -m unittest test_ci_baseline test_keybindings -v "${args[@]}"

  native:
    name: native (Hyprland --verify-config)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      FILTER: ${{ inputs.filter }}
    steps:
      - uses: actions/checkout@v5
      - name: Check every bind on the approved coherent Arch baseline
        run: python3 tools/ci_baseline.py --filter="$FILTER"
