name: App cache and delivery

on:
  push:
    branches: [main]
    paths:
      - 'src/shared/bin/rebuild-app-cache'
      - 'src/shared/bin/smplos-*update*'
      - 'src/shared/lib/smplos-app-bundle.sh'
      - 'src/shared/lib/smplos-release-package.sh'
      - 'src/shared/pkgbuilds/nemo-smpl/PKGBUILD'
      - 'src/shared/pkgbuilds/grafium-bin/PKGBUILD'
      - 'src/shared/configs/systemd/user/smplos-app-cache.*'
      - 'src/shared/installer/install.sh'
      - 'src/fetch-apps.sh'
      - 'src/fetch-org.sh'
      - 'src/build-iso.sh'
      - 'src/builder/build.sh'
      - 'tests/test_app_*.py'
      - '.github/workflows/app-cache.yml'
  pull_request:
    paths:
      - 'src/shared/bin/rebuild-app-cache'
      - 'src/shared/bin/smplos-*update*'
      - 'src/shared/lib/smplos-app-bundle.sh'
      - 'src/shared/lib/smplos-release-package.sh'
      - 'src/shared/pkgbuilds/nemo-smpl/PKGBUILD'
      - 'src/shared/pkgbuilds/grafium-bin/PKGBUILD'
      - 'src/shared/configs/systemd/user/smplos-app-cache.*'
      - 'src/shared/installer/install.sh'
      - 'src/fetch-apps.sh'
      - 'src/fetch-org.sh'
      - 'src/build-iso.sh'
      - 'src/builder/build.sh'
      - 'tests/test_app_*.py'
      - '.github/workflows/app-cache.yml'

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check shell syntax
        run: |
          bash -n src/shared/bin/rebuild-app-cache
          bash -n src/shared/bin/smplos-os-update
          bash -n src/shared/bin/smplos-update-apps
          bash -n src/shared/lib/smplos-app-bundle.sh
          bash -n src/shared/lib/smplos-release-package.sh
          bash -n src/shared/bin/smplos-update
          bash -n src/fetch-apps.sh
          bash -n src/fetch-org.sh
          bash -n src/build-iso.sh
          bash -n src/builder/build.sh
      - name: Exercise isolated cache and update fixtures
        run: python3 -m unittest discover -s tests -p 'test_app_*.py' -v
