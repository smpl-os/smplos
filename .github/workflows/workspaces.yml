name: Workspace policy

on:
  pull_request:
    paths:
      - ".github/workflows/workspaces.yml"
      - "src/shared/bin/*workspace*"
      - "src/shared/bin/*focus*"
      - "src/shared/bin/window-to-*"
      - "src/shared/bin/launch-webapp"
      - "src/shared/bin/popup-toggle"
      - "src/shared/bin/bar-ctl"
      - "src/shared/bin/toggle-messenger"
      - "src/shared/bin/smplos-os-update"
      - "src/shared/eww/**"
      - "src/shared/packages.txt"
      - "src/compositors/hyprland/hypr/**"
      - "migrations/*workspace*.sh"
      - "tests/test_workspace*.py"
      - "tests/test_bar_ctl.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/workspaces.yml"
      - "src/shared/bin/*workspace*"
      - "src/shared/bin/*focus*"
      - "src/shared/bin/window-to-*"
      - "src/shared/bin/launch-webapp"
      - "src/shared/bin/popup-toggle"
      - "src/shared/bin/bar-ctl"
      - "src/shared/bin/toggle-messenger"
      - "src/shared/bin/smplos-os-update"
      - "src/shared/eww/**"
      - "src/shared/packages.txt"
      - "src/compositors/hyprland/hypr/**"
      - "migrations/*workspace*.sh"
      - "tests/test_workspace*.py"
      - "tests/test_bar_ctl.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq lua5.4
      - name: Check workspace behavior and rollout
        run: python3 -m unittest discover -s tests -p 'test_workspace*.py' -v
      - name: Check taskbar preference application
        run: python3 -m unittest discover -s tests -p 'test_bar_ctl.py' -v
